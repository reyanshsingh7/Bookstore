    <img src="logo.png" alt="Logo">
    <h2>Apni Paathshala: The Online Bookstore</h2>
</div>
<div class="nav">

<div class="content">
    <div class="section">
        <h2>Registration</h2>
        <form>
            <div class="formrow">
                Name: <br>
                <input type="text">
            </div>
            <div class="formrow">
                Password: <br>
                <input type="password">
            </div>
            <div class="formrow">
                Email: <br>
                <input type="text">
            </div>
            <div class="formrow">
                Phone Number: <br>
                <input type="text">
            </div>
            <div class="formrow">
                Sex: <br>
                <input type="radio" name="sex"> Male
                <input type="radio" name="sex"> Female
            </div>
            <div class="formrow">
                Date of Birth: <br>
                <select>
                    <option>1</option>
                    <option>2</option>
                    <option>3</option>
                </select>
                <select>
                    <option>January</option>
                    <option>February</option>
                    <option>March</option>
                </select>
                <select>
                    <option>2024</option>
                    <option>2025</option>
                    <option>2026</option>
                </select>
            </div>
            <div class="formrow">
                Languages Known: <br>
                <input type="checkbox"> English
                <input type="checkbox"> Telugu
                <input type="checkbox"> Hindi
                <input type="checkbox"> Tamil
            </div>
            <div class="formrow">
                Address:<textarea rows="3" cols="30"></textarea></div>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </div>
</div>

</div>
</body>
